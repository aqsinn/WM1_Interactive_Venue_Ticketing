<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Velvet Hall Theatre | Ticket Selection</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>Velvet Hall Theatre</h1>
    <p class="subtitle">Choose your seats</p>
  </header>

  <main class="layout">
    <!-- Venue map -->
    <section class="map-panel" aria-labelledby="map-heading">
      <h2 id="map-heading" class="visually-hidden">Venue map</h2>

      <div class="map-controls" role="group" aria-label="Map controls">
        <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
        <button type="button" id="zoom-out" aria-label="Zoom out">&minus;</button>
        <button type="button" id="move-up" aria-label="Move up">&uarr;</button>
        <button type="button" id="move-down" aria-label="Move down">&darr;</button>
        <button type="button" id="move-left" aria-label="Move left">&larr;</button>
        <button type="button" id="move-right" aria-label="Move right">&rarr;</button>
        <button type="button" id="reset-view">Reset view</button>
      </div>

      <div class="map-viewport" id="map-viewport">
        <div class="venue" id="venue">
          <div class="stage">STAGE</div>
          <!-- Sections, rows and seats are generated by js/app.js -->
        </div>
      </div>

      <div class="legend">
        <ul class="state-legend" aria-label="Seat states">
          <li><span class="swatch swatch-available"></span> Available</li>
          <li><span class="swatch swatch-inspected"></span> Selected</li>
          <li><span class="swatch swatch-in-cart"></span> In cart</li>
          <li><span class="swatch swatch-unavailable"></span> Unavailable</li>
        </ul>
        <ul class="price-legend" id="price-legend" aria-label="Price categories">
          <!-- generated from venue data -->
        </ul>
      </div>
    </section>

    <!-- Seat details + cart -->
    <aside class="sidebar">
      <section class="details" aria-labelledby="details-heading">
        <h2 id="details-heading">Seat details</h2>
        <div id="seat-details" aria-live="polite">
          <p class="hint">Click a seat on the map to see its details.</p>
        </div>
        <button type="button" id="add-to-cart" disabled>Add to cart</button>
      </section>

      <section class="cart" aria-labelledby="cart-heading">
        <h2 id="cart-heading">Your cart</h2>
        <p class="hint" id="cart-empty">Your cart is empty.</p>
        <ul id="cart-items"></ul>
        <p class="total">Total: <strong id="cart-total">0 ₼</strong></p>
      </section>
    </aside>
  </main>

  <script src="js/venue.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
